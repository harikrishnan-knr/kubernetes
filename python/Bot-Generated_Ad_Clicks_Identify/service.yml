---
apiVersion: v1
kind: Namespace
metadata:
  name: bot-click-ns
  labels:
    name: bot-click-ns

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bot-click-app
  labels:
    name: bot-click-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bot-click-app
  template:
    metadata:
      labels:
        app: bot-click-app
    spec:
      containers:
      - name: bot-click
        image: harikrishnanknr/bot-click:v1
        ports:
        -  containerPort: 5000

---
apiVersion: v1
kind: Service
metadata:
  name: bot-click-service
  labels:
    name: bot-click-service
spec:
  type: NodePort
  selector:
    app: bot-click-app
  ports:
  - port: 5000
    targetPort: 5000
    nodePort: 30007
